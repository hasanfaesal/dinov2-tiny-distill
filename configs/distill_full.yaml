# Full DataComp-12M fetch (~7.3M images across images, images2..4). ~117M exposures ~ 8h at ~4k img/s.
data_glob: /home/dev/data/images*/*.tar
batch_size: 256          # images per step -> 512 views (2 global views each)
num_workers: 24
epochs: 16
warmup_epochs: 1         # ~7M samples, close to the baseline's 5 x 1.2M
lr: 1.0e-3
weight_decay: 0.05
grad_clip: 3.0
patch_weight: 1.0
ckpt_dir: /home/dev/checkpoints_full
ckpt_every_epochs: 2
knn_every: 1
log_every: 50
metrics_port: 9100
