data_glob: /home/dev/data/images/*.tar
batch_size: 256          # images per step -> 512 views (2 global views each)
num_workers: 24
epochs: 40               # ~1.2M images x 40 = ~48M exposures, ~4h at ~3.3k img/s
warmup_epochs: 5
lr: 1.0e-3
weight_decay: 0.05
grad_clip: 3.0
patch_weight: 1.0
ckpt_dir: /home/dev/checkpoints
ckpt_every_epochs: 5
log_every: 50
metrics_port: 9100
